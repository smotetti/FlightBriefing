<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flight briefing</title>
<style>
:root{
  --bar:#b4c3c9; --paper:#e8edef; --panel:rgba(255,255,255,.95); --ink:#12232b; --muted:#566a72; --line:#c6d2d6;
  --teal:#0e7a7a; --on-teal:#ffffff; --warn:#a64a00;
  --body:"Avenir Next",-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--paper:#0d1619; --panel:rgba(22,37,43,.94); --ink:#e5eef0; --muted:#8ea4ac; --line:#2a3e46;
    --teal:#38b6b6; --on-teal:#04181a; --warn:#eb9a55}
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.45 var(--body);
  padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.photo::before{content:"";position:fixed;inset:0;z-index:-1;
  background:linear-gradient(rgba(8,18,22,.28),rgba(8,18,22,.5)),var(--photo) center/cover no-repeat}
main,.top{max-width:1130px;margin:0 auto}
.top{margin-bottom:16px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;background:var(--bar);color:#12232b;border-radius:14px;padding:14px 22px}
.top img{display:block;height:64px;width:auto;max-width:60%}
.top h1{margin:0;font-size:22px;font-weight:650}
.top a{margin-left:auto;color:#12232b;font-size:16px}
h2{font-size:17px;font-weight:650;margin:0 0 8px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.field{margin-bottom:16px}.field:last-child{margin-bottom:0}
.hint{color:var(--muted);font-size:15px;margin:6px 0 0}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button,.btn{min-height:52px;padding:0 16px;font:inherit;font-size:18px;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:10px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--teal);border-color:var(--teal);color:var(--on-teal);font-weight:650}
.btn.primary{background:var(--teal);border-color:var(--teal);color:var(--on-teal);font-weight:650}
.btn.small{min-height:44px;font-size:16px}
.row2{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;align-items:center}
.step{display:flex;align-items:center;gap:12px}
.step button{width:56px;padding:0;font-size:26px}
.step output{min-width:48px;text-align:center;font:600 30px var(--body)}
.two{display:grid;gap:16px}
@media (min-width:820px){.two{grid-template-columns:1fr 1fr}}
.err{color:var(--warn);font-weight:600}
.paper{margin:0 auto}
.sheetpage{display:block;width:100%;height:auto;background:#fff;margin:0 0 14px;outline:1px solid var(--line)}
a.btn{display:inline-flex;align-items:center;text-decoration:none}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
</style>
</head>
<body>

    else if(p.k === "ln") s += '<line x1="' + p.x1 + '" y1="' + p.y1 + '" x2="' + p.x2 + '" y2="' + p.y2 + '" stroke="' + col(p.c) + '" stroke-width="' + p.lw + '"/>';
    else if(p.k === "ci") s += '<circle cx="' + p.x + '" cy="' + p.y + '" r="' + p.r + '" fill="' + col(p.c) + '"/>';
    else if(p.k === "fr") s += '<rect x="' + p.x + '" y="' + p.y + '" width="' + p.w + '" height="' + p.h + '" fill="' + col(p.c) + '"/>';
    else if(p.k === "tx") s += '<text x="' + p.x + '" y="' + p.y + '" font-family="Helvetica, Arial, sans-serif" font-size="' + p.size + '" font-weight="' + (p.b ? 700 : 400) + '" text-anchor="' + p.a + '" xml:space="preserve" style="white-space:pre">' + esc(p.s) + '</text>';
    else if(p.k === "im") s += '<image href="' + LOGO_URI + '" x="' + p.x + '" y="' + p.y + '" width="' + p.w + '" height="' + p.h + '" preserveAspectRatio="none"/>';
  });
  return s + '</svg>';
}

/* ---------- PDF writer ---------- */
function n3(x){ return String(Math.round(x * 1000) / 1000); }
function pdfStr(s){ return "(" + s.replace(/[\\()]/g, function(c){ return "\\" + c; }) + ")"; }
function buildPdf(pages, logo){
  var K = 0.5523, out = "", offs = [];
  function obj(n, body){ offs[n] = out.length; out += n + " 0 obj\n" + body + "\nendobj\n"; }
  function binStr(u8){ var s = "", i = 0; for(; i < u8.length; i += 8192) s += String.fromCharCode.apply(null, u8.subarray(i, i + 8192)); return s; }
  out = "%PDF-1.4\n%\u00e2\u00e3\u00cf\u00d3\n";
  var nPages = pages.length, firstPage = 6;
  var kids = []; for(var i = 0; i < nPages; i++) kids.push((firstPage + 2 * i) + " 0 R");
  obj(1, "<< /Type /Catalog /Pages 2 0 R >>");
  obj(2, "<< /Type /Pages /Kids [" + kids.join(" ") + "] /Count " + nPages + " >>");
  obj(3, "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>");
  obj(4, "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>");
  if(logo){ var bytes = binStr(logo.rgb); obj(5, "<< /Type /XObject /Subtype /Image /Width " + logo.w + " /Height " + logo.h + " /ColorSpace /DeviceRGB /BitsPerComponent 8 /Interpolate true /Length " + bytes.length + " >>\nstream\n" + bytes + "\nendstream"); }
  else obj(5, "<< >>");
  pages.forEach(function(prims, pi){
    var c = "0 J 0 j\n";
    prims.forEach(function(p){
      if(p.k === "ln"){
        var sc = p.c || [0, 0, 0];
        c += n3(p.lw) + " w " + n3(sc[0]) + " " + n3(sc[1]) + " " + n3(sc[2]) + " RG " + n3(p.x1) + " " + n3(PH - p.y1) + " m " + n3(p.x2) + " " + n3(PH - p.y2) + " l S\n";
      } else if(p.k === "rr"){
        var x0 = p.x, y0 = PH - p.y, x1 = p.x + p.w, y1 = PH - (p.y + p.h), r = p.r, k = K * r;
        c += n3(p.lw) + " w 0 0 0 RG " + n3(x0 + r) + " " + n3(y0) + " m " + n3(x1 - r) + " " + n3(y0) + " l " +
          n3(x1 - r + k) + " " + n3(y0) + " " + n3(x1) + " " + n3(y0 - r + k) + " " + n3(x1) + " " + n3(y0 - r) + " c " +
          n3(x1) + " " + n3(y1 + r) + " l " +
          n3(x1) + " " + n3(y1 + r - k) + " " + n3(x1 - r + k) + " " + n3(y1) + " " + n3(x1 - r) + " " + n3(y1) + " c " +
          n3(x0 + r) + " " + n3(y1) + " l " +
          n3(x0 + r - k) + " " + n3(y1) + " " + n3(x0) + " " + n3(y1 + r - k) + " " + n3(x0) + " " + n3(y1 + r) + " c " +
          n3(x0) + " " + n3(y0 - r) + " l " +
          n3(x0) + " " + n3(y0 - r + k) + " " + n3(x0 + r - k) + " " + n3(y0) + " " + n3(x0 + r) + " " + n3(y0) + " c h S\n";
      } else if(p.k === "ci"){
        var cx = p.x, cy = PH - p.y, rr_ = p.r, kk = K * rr_;
        c += n3(p.c[0]) + " " + n3(p.c[1]) + " " + n3(p.c[2]) + " rg " + n3(cx + rr_) + " " + n3(cy) + " m " +
          n3(cx + rr_) + " " + n3(cy + kk) + " " + n3(cx + kk) + " " + n3(cy + rr_) + " " + n3(cx) + " " + n3(cy + rr_) + " c " +
          n3(cx - kk) + " " + n3(cy + rr_) + " " + n3(cx - rr_) + " " + n3(cy + kk) + " " + n3(cx - rr_) + " " + n3(cy) + " c " +
          n3(cx - rr_) + " " + n3(cy - kk) + " " + n3(cx - kk) + " " + n3(cy - rr_) + " " + n3(cx) + " " + n3(cy - rr_) + " c " +
          n3(cx + kk) + " " + n3(cy - rr_) + " " + n3(cx + rr_) + " " + n3(cy - kk) + " " + n3(cx + rr_) + " " + n3(cy) + " c f\n";
      } else if(p.k === "fr"){
        c += n3(p.c[0]) + " " + n3(p.c[1]) + " " + n3(p.c[2]) + " rg " + n3(p.x) + " " + n3(PH - (p.y + p.h)) + " " + n3(p.w) + " " + n3(p.h) + " re f\n";
      } else if(p.k === "tx"){
        var w = tw(p.s, p.size, p.b), x = p.a === "end" ? p.x - w : p.a === "middle" ? p.x - w / 2 : p.x;
        c += "0 g BT /" + (p.b ? "F2" : "F1") + " " + n3(p.size) + " Tf 1 0 0 1 " + n3(x) + " " + n3(PH - p.y) + " Tm " + pdfStr(p.s) + " Tj ET\n";
      } else if(p.k === "im" && logo){
        c += "q " + n3(p.w) + " 0 0 " + n3(p.h) + " " + n3(p.x) + " " + n3(PH - (p.y + p.h)) + " cm /Im1 Do Q\n";
      }
    });
    var pn = firstPage + 2 * pi;
    obj(pn, "<< /Type /Page /Parent 2 0 R /MediaBox [0 0 " + PW + " " + PH + "] /Resources << /Font << /F1 3 0 R /F2 4 0 R >>" + (logo ? " /XObject << /Im1 5 0 R >>" : "") + " >> /Contents " + (pn + 1) + " 0 R >>");
    obj(pn + 1, "<< /Length " + c.length + " >>\nstream\n" + c + "endstream");
  });
  var total = firstPage + 2 * nPages, xr = out.length;
  out += "xref\n0 " + total + "\n0000000000 65535 f \n";
  for(var n = 1; n < total; n++) out += ("0000000000" + offs[n]).slice(-10) + " 00000 n \n";
  out += "trailer\n<< /Size " + total + " /Root 1 0 R >>\nstartxref\n" + xr + "\n%%EOF\n";
  var u = new Uint8Array(out.length); for(var j = 0; j < out.length; j++) u[j] = out.charCodeAt(j) & 255;
  return u;
}

/* ---------- storage and intake ---------- */
function decodeFlight(d){
  var b = d.replace(/-/g, "+").replace(/_/g, "/"); while(b.length % 4) b += "=";
  return JSON.parse(decodeURIComponent(escape(atob(b))));
}
function dateKey(d){ var p = String(d || "").split("/"); return p.length === 3 ? p[2] + p[1] + p[0] : "0"; }
function curCard(){ return D.cards.filter(function(c){ return c.id === D.sel; })[0] || null; }
function saveDeck(){ try{ localStorage.setItem(DKEY, JSON.stringify(D)); }catch(e){} }
function loadDeck(){
  try{ var t = localStorage.getItem(DKEY); if(t){ var j = JSON.parse(t); if(j && j.cards) D = j; } }catch(e){}
  var n = new Date(), y = new Date(n.getFullYear(), n.getMonth(), n.getDate() - 1);
  var cut = "" + y.getFullYear() + ("0" + (y.getMonth() + 1)).slice(-2) + ("0" + y.getDate()).slice(-2);
  D.cards = D.cards.filter(function(c){ return dateKey(c.flight && c.flight.date) >= cut; });
  if(!curCard()) D.sel = D.cards.length ? D.cards[0].id : null;
}
function sortDeck(){ D.cards.sort(function(a, b){ var x = dateKey(a.flight.date) + (a.flight.std || ""), y = dateKey(b.flight.date) + (b.flight.std || ""); return x < y ? -1 : x > y ? 1 : 0; }); }
function putCard(o){
  if(!o || !o.flight) return null;
  var f = o.flight, id = [f.date, f.number, f.from, f.to].join("|");
  var card = D.cards.filter(function(c){ return c.id === id; })[0], isNew = !card;
  if(isNew) card = {id:id, opts:{op:"SCHEDULED", bags:null, trol:"all", pantry:false}};
  card.flight = f; card.crew = o.crew || []; card.pax = o.pax || {business:0, economy:0}; card.mel = o.mel || []; card.errors = o.errors || [];
  var n = counts(card.crew); if(card.opts.bags === null || card.opts.bags > n.p + n.c) card.opts.bags = n.p + n.c;
  if(isNew) D.cards.push(card);
  return id;
}
function intake(o){
  INTAKE = [];
  if(o && o.flights){
    var ids = [];
    o.flights.forEach(function(f){ var id = putCard(f); if(id) ids.push(id); else if(f && f.errors) INTAKE = INTAKE.concat(f.errors); });
    if(o.day) D.cards = D.cards.filter(function(c){ return c.flight.date !== o.day || ids.indexOf(c.id) >= 0; });
    if(o.errors && o.errors.length) INTAKE = INTAKE.concat(o.errors);
    if(!ids.length && !INTAKE.length) INTAKE = ["No flights were found for that day."];
    sortDeck();
    var first = D.cards.filter(function(c){ return ids.indexOf(c.id) >= 0; })[0];
    if(first) D.sel = first.id;
    saveDeck(); return;
  }
  var id1 = putCard(o);
  if(!id1){ INTAKE = (o && o.errors && o.errors.length) ? o.errors : ["No flight data was received. Tap Briefing on the duty plan page again."]; return; }
  sortDeck(); D.sel = id1; saveDeck();
}

/* ---------- screen ---------- */
function seg(name, items, current){
  return '<div class="seg">' + items.map(function(it){ return '<button type="button" data-set="' + name + '" data-v="' + esc(it[0]) + '" aria-pressed="' + (it[0] === current) + '">' + esc(it[1]) + '</button>'; }).join("") + '</div>';
}
function render(){
  var app = document.getElementById("app"), h = "";
  if(INTAKE.length) h += '<div class="panel"><p class="err">' + INTAKE.map(esc).join("<br>") + '</p></div>';
  if(!D.cards.length){
    h += '<div class="panel"><h2>No flights yet</h2><p>Open the duty plan page on the portal and tap Briefing in your Safari Favorites. All the flights of today appear here as cards.</p></div>';
  } else {
    var c = curCard(), n = counts(c.crew), max = n.p + n.c, res = cardRes(c);
    var chips = D.cards.map(function(x){ return '<button type="button" data-card="' + esc(x.id) + '" aria-pressed="' + (x.id === D.sel) + '">' + esc(x.flight.number) + ', ' + esc(x.flight.from) + ' to ' + esc(x.flight.to) + '</button>'; }).join("");
    h += '<div class="panel"><h2>Flights</h2><div class="seg">' + chips + '</div>' +
      '<div class="row2"><button class="btn primary" type="button" id="make">Create PDF</button>' +
      '<span id="pdfmsg"></span></div></div>';
    h += '<div class="panel"><h2>' + esc(c.flight.number) + ', ' + esc(c.flight.from) + ' to ' + esc(c.flight.to) + '</h2>' +
      ((c.errors && c.errors.length) ? '<p class="err">' + c.errors.map(esc).join("<br>") + '</p>' : '') + '<div class="two"><div>' +
      '<div class="field"><div>Operation</div>' + seg("op", OPS, c.opts.op) + '</div>' +
      '<div class="field"><div>Trolleys</div>' + seg("trol", TROL, c.opts.trol) + '</div></div><div>' +
      '<div class="field"><div>Crew bags on board</div><div class="step"><button class="btn" type="button" data-bags="-1" aria-label="One fewer bag">\u2212</button><output>' + c.opts.bags + '</output><button class="btn" type="button" data-bags="1" aria-label="One more bag">+</button></div><p class="hint">Standard is ' + max + ', one per crew member</p></div>' +
      (hasPantry(c) ? '<div class="field"><div>Pantry</div><div class="seg"><button type="button" data-pantry="1" aria-pressed="' + c.opts.pantry + '">Pantry CHT</button></div></div>' : '') +
      '</div></div>' +
      '<p class="hint">' + (res.error ? '<span class="err">' + esc(res.error) + ' DOW and DOI show -- on the card.</span>' : 'DOW ' + res.dow + ', DOI ' + res.doi.toFixed(2) + (res.fwd !== null ? ', FWD ' + res.fwd.toFixed(2) : '')) + '</p>' +
      '<div class="row2"><button class="btn small" type="button" data-remove="1">Remove this flight</button><button class="btn small" type="button" data-clear="1">Clear all flights</button></div></div>';
    h += '<div class="paper" id="paper">' + buildPages().map(svgPage).join("") + '</div>';
  }
  h += '<div class="panel"><p class="hint" style="margin:0 0 10px">' + (W ? 'Weight tables are loaded.' : 'The weight tables are not loaded, so DOW and DOI show -- on the cards.') + '</p><button class="btn small" id="pick" type="button">' + (W ? 'Replace weights file' : 'Choose weights file') + '</button> <a class="btn small" style="margin-left:8px" href="bookmarklet.html">Set up the import button</a></div>';
  app.innerHTML = h;
}
function makePdf(){
  var bytes = buildPdf(buildPages(), LOGO), url = URL.createObjectURL(new Blob([bytes], {type:"application/pdf"}));
  if(pdfUrl) try{ URL.revokeObjectURL(pdfUrl); }catch(e){}
  pdfUrl = url;
  var w = null; try{ w = window.open(url, "_blank"); }catch(e){}
  var m = document.getElementById("pdfmsg");
  if(m) m.innerHTML = w ? 'The PDF opened. Use its Share button to save it or print it.' : '<a class="btn primary" href="' + url + '" target="_blank" rel="noopener">Open the PDF</a>';
}
document.addEventListener("click", function(e){
  var t = e.target.closest("button"); if(!t) return;
  var c = curCard();
  if(t.id === "pick"){ document.getElementById("file").click(); return; }
  if(t.id === "make"){ makePdf(); return; }
  if(t.dataset.card){ D.sel = t.dataset.card; saveDeck(); render(); return; }
  if(c && t.dataset.set){ c.opts[t.dataset.set] = t.dataset.v; saveDeck(); render(); return; }
  if(c && t.dataset.bags){ var n = counts(c.crew); c.opts.bags = Math.max(0, Math.min(n.p + n.c, c.opts.bags + (+t.dataset.bags))); saveDeck(); render(); return; }
  if(c && t.dataset.pantry){ c.opts.pantry = !c.opts.pantry; saveDeck(); render(); return; }
  if(t.dataset.remove){ D.cards = D.cards.filter(function(x){ return x.id !== D.sel; }); D.sel = D.cards.length ? D.cards[0].id : null; saveDeck(); render(); return; }
  if(t.dataset.clear){ if(window.confirm("Remove all saved flights from this iPad?")){ D = {cards:[], sel:null}; saveDeck(); render(); } }
});
document.addEventListener("change", function(e){
  if(e.target.id === "file" && e.target.files[0]){
    var rd = new FileReader();
    rd.onload = function(){ try{ var j = JSON.parse(rd.result); if(!j.tables) throw new Error("no tables"); W = j; try{ localStorage.setItem(WKEY, rd.result); }catch(x){} }catch(err){ INTAKE = ["Could not read that weights file."]; } render(); };
    rd.readAsText(e.target.files[0]); e.target.value = "";
  }
});
function setLogo(w, h, rgb){ LOGO = {w:w, h:h, rgb:rgb}; }
function loadLogo(){
  var im = new Image();
  im.onload = function(){
    try{
      var cv = document.createElement("canvas"); cv.width = 768; cv.height = 128;
      var cx = cv.getContext("2d"); cx.fillStyle = "#fff"; cx.fillRect(0, 0, 768, 128); cx.drawImage(im, 0, 0, 768, 128);
      var d = cx.getImageData(0, 0, 768, 128).data, rgb = new Uint8Array(768 * 128 * 3);
      for(var i = 0, j = 0; i < d.length; i += 4){ rgb[j++] = d[i]; rgb[j++] = d[i + 1]; rgb[j++] = d[i + 2]; }
      setLogo(768, 128, rgb);
    }catch(e){}
  };
  im.src = LOGO_URI;
}
(function init(){
  (function findPhoto(list){
    var n = list.shift(); if(!n) return;
    var im = new Image();
    im.onload = function(){ document.body.style.setProperty("--photo", 'url("' + n + '")'); document.body.classList.add("photo"); };
    im.onerror = function(){ findPhoto(list); };
    im.src = n;
  })(["background.jpg","background.jpeg","background.png","background.webp","Background.jpg","background.JPG","background.JPEG","background.PNG"]);
  try{ var t = localStorage.getItem(WKEY); if(t) W = JSON.parse(t); }catch(e){}
  loadDeck();
  var h = new URLSearchParams(location.hash.slice(1)), raw = h.get("d");
  if(raw){
    try{ intake(decodeFlight(raw)); }catch(e){ INTAKE = ["The flight data could not be read. Tap Briefing on the duty plan page again."]; }
    try{ history.replaceState(null, "", location.pathname + location.search); }catch(e){}
  }
  loadLogo(); render();
})();
window.__t = {cardPrims:cardPrims, buildPdf:buildPdf, buildPages:buildPages, setLogo:setLogo, crewRows:crewRows, melLines:melLines, cardRes:cardRes, compute:compute, tw:tw, lat1:lat1};
</script>
