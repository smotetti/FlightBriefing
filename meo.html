<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>mEO</title>
<style>
:root{--bar:#b4c3c9;--paper:#e8edef;--panel:rgba(255,255,255,.95);--ink:#12232b;--muted:#566a72;--line:#c6d2d6;--teal:#0e7a7a;--on-teal:#fff;--warn:#a64a00;
  --body:"Avenir Next",-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif}
@media (prefers-color-scheme:dark){:root{--paper:#0d1619;--panel:rgba(22,37,43,.94);--ink:#e5eef0;--muted:#8ea4ac;--line:#2a3e46;--teal:#38b6b6;--on-teal:#04181a;--warn:#eb9a55}}
*{box-sizing:border-box}[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:18px/1.45 var(--body);
  padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.photo::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(rgba(8,18,22,.28),rgba(8,18,22,.5)),var(--photo) center/cover no-repeat}
main,.top{max-width:1130px;margin:0 auto}
.top{margin-bottom:16px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;background:var(--bar);color:#12232b;border-radius:14px;padding:14px 22px}
.top img{display:block;height:64px;width:auto;max-width:60%}.top h1{margin:0;font-size:22px;font-weight:650}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
h2{margin:0 0 10px;font-size:19px}
.crumbs{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.btn,.item{font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:12px;cursor:pointer;text-align:left}
.btn{min-height:52px;padding:0 16px;font-size:18px}
.btn.primary{background:var(--teal);border-color:var(--teal);color:var(--on-teal);font-weight:650}
a.btn{display:inline-flex;align-items:center;text-decoration:none}
.search{width:100%;min-height:56px;font:inherit;font-size:20px;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:0 16px;margin-bottom:14px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.item{min-height:76px;padding:12px 16px;display:flex;flex-direction:column;justify-content:center}
.item b{font-size:24px;letter-spacing:.02em}.item span{color:var(--muted);font-size:16px}
.item.rwy b{font-size:30px}
.item.rwy[data-empty="1"]{opacity:.7}
.tag{display:inline-block;margin-top:2px;font-size:13px;color:var(--warn);font-weight:650}
.chart{display:block;width:100%;height:auto;background:#fff;border-radius:10px}
.hint{color:var(--muted);font-size:15px;margin:6px 0 0}
.err{color:var(--warn);font-weight:600}
.row2{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;align-items:center}
pre.text{white-space:pre-wrap;font:16px/1.5 var(--body);margin:0}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
</style>
</head>
<body>
<header class="top"><img id="logo" src="logo.png" alt="Air Dolomiti" onerror="this.hidden=true"><h1>mEO</h1></header>
<main id="app"></main>
<script>
"use strict";
var DATA = null, LOADERR = "", FILTER = "", RKEY = "meo.recent.v1";
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function airports(){ return (DATA && DATA.airports || []).slice().sort(function(a, b){ return a.name.localeCompare(b.name); }); }
function findAp(icao){ return airports().filter(function(a){ return a.icao === icao; })[0] || null; }
function route(){
  var h = decodeURIComponent(location.hash.replace(/^#/, "")).split("/");
  return {icao: (h[0] || "").toUpperCase(), rwy: h[1] || ""};
}
function go(icao, rwy){ location.hash = icao ? (rwy ? icao + "/" + rwy : icao) : ""; if(!icao) history.replaceState(null, "", location.pathname + location.search); }
function recents(){ try{ return JSON.parse(localStorage.getItem(RKEY)) || []; }catch(e){ return []; } }
function remember(icao, rwy){
  var k = icao + "/" + rwy, l = recents().filter(function(x){ return x !== k; }); l.unshift(k);
  try{ localStorage.setItem(RKEY, JSON.stringify(l.slice(0, 6))); }catch(e){}
}
function apLabel(a){ return esc(a.name) + (a.iata ? ", " + esc(a.iata) : ""); }

function viewAirports(){
  var q = FILTER.trim().toLowerCase(), list = airports().filter(function(a){
    return !q || (a.icao + " " + (a.iata || "") + " " + a.name).toLowerCase().indexOf(q) >= 0; });
  var h = '<div class="panel"><h2>Airport</h2><input class="search" id="q" type="search" placeholder="Search by name or code" value="' + esc(FILTER) + '" autocomplete="off" autocapitalize="off">';
  var rec = recents().map(function(k){ var p = k.split("/"), a = findAp(p[0]); return a ? {a:a, r:p[1]} : null; }).filter(Boolean);
  if(rec.length && !q){
    h += '<p class="hint">Recent</p><div class="grid" style="margin-bottom:16px">' + rec.map(function(x){
      return '<button class="item" type="button" data-go="' + esc(x.a.icao + "/" + x.r) + '"><b>' + esc(x.a.icao) + ' RWY ' + esc(x.r) + '</b><span>' + esc(x.a.name) + '</span></button>'; }).join("") + '</div><p class="hint">All airports</p>';
  }
  h += list.length ? '<div class="grid">' + list.map(function(a){
    return '<button class="item" type="button" data-go="' + esc(a.icao) + '"><b>' + esc(a.icao) + '</b><span>' + apLabel(a) + '</span></button>'; }).join("") + '</div>'
    : '<p class="hint">No airport matches that search.</p>';
  return h + '</div>';
}
function viewRunways(a){
  return '<div class="panel"><div class="crumbs"><button class="btn" type="button" data-go="">All airports</button></div><h2>' + esc(a.icao) + ', ' + apLabel(a) + '</h2><p class="hint" style="margin:0 0 12px">Choose the runway</p><div class="grid">' +
    a.runways.map(function(r){ return '<button class="item rwy" type="button" data-go="' + esc(a.icao + "/" + r.id) + '"' + (r.chart ? '' : ' data-empty="1"') + '><b>RWY ' + esc(r.id) + '</b>' + (r.chart ? '' : '<span class="tag">No chart yet</span>') + '</button>'; }).join("") +
    '</div></div>';
}
function viewChart(a, r){
  var h = '<div class="panel"><div class="crumbs"><button class="btn" type="button" data-go="">All airports</button><button class="btn" type="button" data-go="' + esc(a.icao) + '">' + esc(a.icao) + ' runways</button></div>' +
    '<h2>' + esc(a.icao) + ', ' + apLabel(a) + ', RWY ' + esc(r.id) + '</h2>';
  if(r.chart){
    h += '<img class="chart" id="chart" src="' + esc(r.chart) + '" alt="Single engine procedure, ' + esc(a.name) + ' runway ' + esc(r.id) + '">' +
      '<div class="row2"><a class="btn" href="' + esc(r.chart) + '" target="_blank" rel="noopener">Open full size</a>' +
      (r.revision ? '<span class="hint" style="margin:0">Revision ' + esc(r.revision) + '</span>' : '') + '</div>';
  } else {
    h += '<p class="err">There is no chart for this runway yet.</p>';
  }
  if(r.text) h += '<h2 style="margin-top:18px">Procedure text</h2><pre class="text">' + esc(r.text) + '</pre>';
  var others = a.runways.filter(function(x){ return x.id !== r.id; });
  if(others.length) h += '<div class="row2">' + others.map(function(x){ return '<button class="btn" type="button" data-go="' + esc(a.icao + "/" + x.id) + '">RWY ' + esc(x.id) + '</button>'; }).join("") + '</div>';
  return h + '</div>';
}
function render(){
  var app = document.getElementById("app");
  if(LOADERR){ app.innerHTML = '<div class="panel"><p class="err">' + esc(LOADERR) + '</p><button class="btn" type="button" id="retry">Try again</button></div>'; return; }
  if(!DATA){ app.innerHTML = '<div class="panel"><p>Loading procedures...</p></div>'; return; }
  var rt = route(), a = rt.icao ? findAp(rt.icao) : null, h;
  if(a && rt.rwy){
    var r = a.runways.filter(function(x){ return x.id === rt.rwy; })[0];
    if(r){ if(r.chart) remember(a.icao, r.id); h = viewChart(a, r); } else h = viewRunways(a);
  } else if(a) h = viewRunways(a); else h = viewAirports();
  h += '<div class="panel"><p class="hint" style="margin:0 0 10px" id="offmsg">' + (DATA.updated ? 'Database updated ' + esc(DATA.updated) + '. ' : '') + '</p><button class="btn" type="button" id="offline">Save all charts for offline use</button></div>';
  app.innerHTML = h;
  window.scrollTo(0, 0);
}
function saveOffline(){
  var msg = document.getElementById("offmsg"), files = [];
  airports().forEach(function(a){ a.runways.forEach(function(r){ if(r.chart) files.push(r.chart); }); });
  if(!files.length){ msg.textContent = "There are no charts to save yet."; return; }
  var done = 0, bad = 0;
  msg.textContent = "Saving 0 of " + files.length + "...";
  Promise.all(files.map(function(f){
    return fetch(f, {cache: "reload"}).then(function(r){ if(!r.ok) throw 0; return r.blob(); }).catch(function(){ bad++; })
      .then(function(){ done++; msg.textContent = "Saving " + done + " of " + files.length + "..."; });
  })).then(function(){ msg.textContent = bad ? "Saved " + (files.length - bad) + " charts. " + bad + " could not be saved, try again." : "All " + files.length + " charts are saved on this iPad."; });
}
document.addEventListener("click", function(e){
  var t = e.target.closest("button"); if(!t) return;
  if(t.dataset.go !== undefined){ var p = t.dataset.go.split("/"); FILTER = ""; go(p[0], p[1]); render(); return; }
  if(t.id === "retry"){ load(); return; }
  if(t.id === "offline"){ saveOffline(); }
});
document.addEventListener("input", function(e){
  if(e.target.id === "q"){ FILTER = e.target.value; var pos = e.target.selectionStart; render(); var q = document.getElementById("q"); if(q){ q.focus(); q.setSelectionRange(pos, pos); } }
});
window.addEventListener("hashchange", render);
function load(){
  LOADERR = ""; render();
  fetch("meo-data.json", {cache: "no-cache"}).then(function(r){ if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function(j){ if(!j || !j.airports) throw new Error("no airports"); DATA = j; render(); })
    .catch(function(){ LOADERR = "The procedure database could not be loaded. If you are offline, open mEO once while online so it can be saved on this iPad."; render(); });
}
(function init(){
  (function findPhoto(list){
    var n = list.shift(); if(!n) return;
    var im = new Image();
    im.onload = function(){ document.body.style.setProperty("--photo", 'url("' + n + '")'); document.body.classList.add("photo"); };
    im.onerror = function(){ findPhoto(list); };
    im.src = n;
  })(["background.jpg","background.jpeg","background.png","background.webp","Background.jpg","background.JPG","background.JPEG","background.PNG"]);
  try{ if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function(){}); }catch(e){}
  load();
})();
window.__t = {setData: function(d){ DATA = d; LOADERR = ""; render(); }, render: render};
</script>
<script src="menu.js"></script>
</body>
</html>
