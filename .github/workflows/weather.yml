name: Weather
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  weather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch METAR and TAF
        run: python3 fetch_weather.py
      - name: Save weather.json
        run: |
          git config user.name "weather-bot"
          git config user.email "weather-bot@users.noreply.github.com"
          git add weather.json
          git diff --cached --quiet || git commit -m "Update weather"
          git push
